<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1C1B3A" />
    <title>Mất kết nối · Lớp Song Ngữ</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f4ff; color: #1c1b3a; }
      .card { max-width: 380px; width: 100%; background: #fff; border: 2px solid #e6e3f5; border-radius: 24px; padding: 28px 22px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { font-size: 22px; margin: 16px 0 6px; }
      p { margin: 4px 0; color: #55537a; line-height: 1.5; }
      .en { color: #1e3fb8; font-weight: 600; font-style: normal; }
      button { margin-top: 18px; height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: #2f5bea; color: #fff;
        font-size: 16px; font-weight: 700; box-shadow: 0 4px 0 #1e3fb8; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/192" alt="" />
      <h1>Mất kết nối mạng</h1>
      <p class="en">You are offline.</p>
      <p>Em kiểm tra Wi-Fi hoặc dữ liệu di động rồi bấm “Thử lại”. Câu trả lời chưa gửi sẽ không bị tính.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
